<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KER Lumira · 초기 설정 Prototype</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><h1>루미라 초기 설정</h1><p class="badge">F2001-S02 · 가상 기기 · 실제 로봇 미연결</p><p>이 Prototype은 등록·저장·설정 적용·첫 인사를 로컬에서 재현합니다.</p>
<section><h2>연결 및 재개</h2><label>개발용 토큰<input id="token" type="password" autocomplete="off" placeholder="KER_DEMO_TOKEN 또는 보호자 토큰"></label><button id="login">연결 확인</button><label>가상 기기<select id="device"></select></label><button id="start">설정 시작·재개</button><button id="reconnect">가상 기기 재연결</button><button id="disconnect">단절 시험</button><label>재개할 세션 ID<input id="resumeId" placeholder="최근 세션 ID를 자동 표시"></label><button id="resume">세션 재개</button></section>
<section id="wizard" hidden><h2 id="heading">설정</h2><p id="progress"></p><div id="fields"></div><div class="buttons"><button id="back">뒤로</button><button id="next">저장하고 다음</button><button id="skip">기본 선호로 건너뛰기</button><button id="guide">안내 반복</button><button id="preview">음성·표현 미리보기</button><button id="cancel">설정 취소</button></div><pre id="review"></pre></section>
<section><h2>등록 및 적용 확인</h2><button id="complete">최종 등록</button><button id="apply">가상 설정 적용·재시도</button><button id="greet">첫 인사</button><p id="greeting"></p><pre id="result" aria-live="polite">먼저 개발용 토큰으로 연결하세요.</pre><p>음성 버튼은 브라우저의 음성 합성을 사용합니다. 음성 엔진에 따라 선택 음성과 다를 수 있으며 실제 로봇 TTS 결과가 아닙니다. 네트워크 없는 환경에서는 텍스트 인사를 기준으로 확인합니다.</p></section>
</main></body></html>
