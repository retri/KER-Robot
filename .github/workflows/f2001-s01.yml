name: KR1-3 F2001-S01 tests
on:
  push:
    paths:
      - 'Epic-01/F2001/F2001-S01/**'
      - '.github/workflows/f2001-s01.yml'
  pull_request:
    paths:
      - 'Epic-01/F2001/F2001-S01/**'
      - '.github/workflows/f2001-s01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Epic-01/F2001/F2001-S01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke.py
