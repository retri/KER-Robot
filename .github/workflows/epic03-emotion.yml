name: Epic-03 emotion contract prototype
on:
  push:
    paths: ['Epic-03/**', '.github/workflows/epic03-emotion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Epic-03 synthetic contract suite
        run: python Epic-03/runtime/run.py
      - name: Synthetic fusion and revocation demo
        run: python Epic-03/runtime/demo.py
      - name: Epic-02 regression
        run: python Epic-02/runtime/run.py
      - name: Epic-01 regression
        run: python Epic-01/integration/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic03-prototype-evidence
          path: |
            Epic-03/runtime/evidence/
            Epic-02/runtime/evidence/
            Epic-01/integration/evidence/
