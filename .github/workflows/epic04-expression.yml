name: Epic-04 expression contract prototype
on:
  push:
    paths: ['Epic-04/**', '.github/workflows/epic04-expression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Epic-04 synthetic contract suite
        run: python Epic-04/runtime/run.py
      - name: Expression planning and cancellation demo
        run: python Epic-04/runtime/demo.py
      - name: Epic-03 regression
        run: python Epic-03/runtime/run.py
      - name: Epic-02 regression
        run: python Epic-02/runtime/run.py
      - name: Epic-01 regression
        run: python Epic-01/integration/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epic04-prototype-evidence
          path: |
            Epic-04/runtime/evidence/
            Epic-03/runtime/evidence/
            Epic-02/runtime/evidence/
            Epic-01/integration/evidence/
