name: KR1-5 F2001-S03 integration lab
on:
  push:
    paths:
      - 'Epic-01/F2001/F2001-S03/**'
      - 'Epic-01/F2001/F2001-S02/**'
      - '.github/workflows/f2001-s03.yml'
  pull_request:
    paths:
      - 'Epic-01/F2001/F2001-S03/**'
      - 'Epic-01/F2001/F2001-S02/**'
      - '.github/workflows/f2001-s03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Epic-01/F2001/F2001-S03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m onboarding_lab.runner --mode simulated --samples 100 --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: F2001-S03-test-evidence
          path: Epic-01/F2001/F2001-S03/results/
          if-no-files-found: error
